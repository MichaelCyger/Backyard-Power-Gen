<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif">
 <rect width="1000" height="520" fill="#f7f6f2"/>
 <text x="24" y="28" font-size="16" font-weight="700" fill="#1a1a1a">Figure 6. Floor chase labyrinth</text>
 <text x="24" y="48" font-size="11" fill="#444">No straight line from the core to the grass. Two 90-degree bends, BPE-lined. Streaming is an MCNP tally (50 microrem/h or less at the house-end pipe).</text>

 <!-- vault bottom -->
 <rect x="60" y="80" width="360" height="360" fill="#9a9a92" stroke="#333" stroke-width="2"/>
 <text x="150" y="105" font-size="12" font-weight="700" fill="#1a1a1a">Vault bottom shield</text>
 <rect x="140" y="130" width="200" height="80" fill="#c45c26"/>
 <text x="188" y="176" font-size="12" fill="#fff" font-weight="700">Core (above)</text>
 <rect x="160" y="230" width="80" height="140" fill="#3d6b8a"/>
 <rect x="160" y="330" width="200" height="50" fill="#3d6b8a"/>
 <rect x="300" y="280" width="50" height="100" fill="#3d6b8a"/>
 <text x="168" y="300" font-size="10" fill="#fff">BPE</text>
 <text x="168" y="314" font-size="10" fill="#fff">lined</text>
 <text x="220" y="360" font-size="10" fill="#fff">labyrinth</text>

 <!-- pipes -->
 <path d="M200 230 L200 355 L325 355 L325 300" fill="none" stroke="#c47a2a" stroke-width="8"/>
 <path d="M200 230 L200 355 L325 355 L325 300" fill="none" stroke="#f0d0a0" stroke-width="3"/>
 <circle cx="200" cy="220" r="6" fill="#8a5010"/>
 <text x="80" y="250" font-size="10" fill="#333">1st 90-degree</text>
 <text x="250" y="400" font-size="10" fill="#333">2nd 90-degree</text>

 <!-- out -->
 <path d="M350 300 L520 300" fill="none" stroke="#c47a2a" stroke-width="8"/>
 <path d="M350 300 L520 300" fill="none" stroke="#f0d0a0" stroke-width="3"/>
 <text x="360" y="288" font-size="11" fill="#6a3a08">double-wall oil + I&amp;C</text>

 <rect x="520" y="200" width="420" height="220" fill="#e8dcc8" stroke="#5a4a38" stroke-width="2"/>
 <text x="640" y="230" font-size="13" font-weight="700" fill="#1a1a1a">House end (serviceable)</text>
 <text x="550" y="260" font-size="12" fill="#333">Oil pump - Stirling skid - hydronic HX</text>
 <text x="550" y="282" font-size="12" fill="#333">Inverter - gateway - battery</text>
 <text x="550" y="314" font-size="12" fill="#333">No core shine line of sight.</text>
 <text x="550" y="336" font-size="12" fill="#333">Leak here is hazmat, not a core event.</text>
 <text x="550" y="368" font-size="12" fill="#333">Frost: below frost line or trickle / heater.</text>

 <!-- forbidden lid -->
 <text x="60" y="470" font-size="12" fill="#8a2020" font-weight="700">Forbidden: any penetration through the lid (would point at the playset).</text>
 <text x="60" y="492" font-size="11" fill="#444">Allowed through floor only: 2 x oil (process + containment), instrument bundle, startup-heater power (locked out after start), ground.</text>
</svg>
