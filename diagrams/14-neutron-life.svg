<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif">
 <rect width="1100" height="720" fill="#f7f6f2"/>
 <text x="24" y="28" font-size="16" font-weight="700" fill="#1a1a1a">Figure 14. What a neutron can do in this core</text>
 <text x="24" y="48" font-size="11" fill="#444">Born fast (~2 MeV). Graphite knocks it down to thermal (~0.025 eV) in many collisions. Then it either splits U-235, is captured, or leaks into the shield.</text>

 <defs>
  <marker id="a14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
   <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
  </marker>
 </defs>

 <!-- start -->
 <rect x="40" y="90" width="160" height="54" rx="5" fill="#c45c26"/>
 <text x="120" y="114" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">Fast n from fission</text>
 <text x="120" y="132" font-size="10" fill="#f0d0c0" text-anchor="middle">~2 MeV</text>

 <line x1="200" y1="117" x2="248" y2="117" stroke="#111" stroke-width="2" marker-end="url(#a14)"/>

 <rect x="250" y="90" width="200" height="54" rx="5" fill="#5a5a5a"/>
 <text x="350" y="114" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">Scatter in graphite</text>
 <text x="350" y="132" font-size="10" fill="#ddd" text-anchor="middle">C-12, many collisions</text>

 <line x1="450" y1="117" x2="498" y2="117" stroke="#111" stroke-width="2" marker-end="url(#a14)"/>

 <rect x="500" y="90" width="180" height="54" rx="5" fill="#3d6b8a"/>
 <text x="590" y="114" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">Thermal n</text>
 <text x="590" y="132" font-size="10" fill="#d0e4f0" text-anchor="middle">~0.025 eV, room-like</text>

 <!-- four outcomes -->
 <line x1="590" y1="144" x2="590" y2="200" stroke="#111" stroke-width="2"/>
 <line x1="160" y1="200" x2="980" y2="200" stroke="#111" stroke-width="2"/>
 <line x1="160" y1="200" x2="160" y2="228" stroke="#111" stroke-width="2" marker-end="url(#a14)"/>
 <line x1="430" y1="200" x2="430" y2="228" stroke="#111" stroke-width="2" marker-end="url(#a14)"/>
 <line x1="700" y1="200" x2="700" y2="228" stroke="#111" stroke-width="2" marker-end="url(#a14)"/>
 <line x1="980" y1="200" x2="980" y2="228" stroke="#111" stroke-width="2" marker-end="url(#a14)"/>

 <rect x="60" y="230" width="200" height="70" rx="5" fill="#c45c26"/>
 <text x="160" y="258" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">Fission</text>
 <text x="160" y="276" font-size="10" fill="#f0d0c0" text-anchor="middle">n + U-235 -> heat + 2 to 3 n</text>
 <text x="160" y="292" font-size="10" fill="#f0d0c0" text-anchor="middle">the chain continues</text>

 <rect x="330" y="230" width="200" height="70" rx="5" fill="#6b3a1f"/>
 <text x="430" y="258" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">Capture in U-238</text>
 <text x="430" y="276" font-size="10" fill="#f0d0c0" text-anchor="middle">U-238 captures n, later Pu-239</text>
 <text x="430" y="292" font-size="10" fill="#f0d0c0" text-anchor="middle">some of that Pu also splits</text>

 <rect x="600" y="230" width="200" height="70" rx="5" fill="#2a4a2a"/>
 <text x="700" y="258" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">Capture in poison</text>
 <text x="700" y="276" font-size="10" fill="#cfe0cf" text-anchor="middle">B-10, Gd, Er, Xe-135</text>
 <text x="700" y="292" font-size="10" fill="#cfe0cf" text-anchor="middle">kills the chain on purpose</text>

 <rect x="880" y="230" width="200" height="70" rx="5" fill="#5c5c5c"/>
 <text x="980" y="258" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">Leak</text>
 <text x="980" y="276" font-size="10" fill="#ddd" text-anchor="middle">leaves the core, hits BPE</text>
 <text x="980" y="292" font-size="10" fill="#ddd" text-anchor="middle">Chapter 3's yard problem</text>

 <text x="40" y="350" font-size="13" font-weight="700" fill="#1a1a1a">In the yard</text>
 <text x="40" y="372" font-size="13" fill="#333">Graphite is the traffic cop. It slows neutrons so they are likely to split U-235</text>
 <text x="40" y="390" font-size="13" fill="#333">instead of flying out. Boron in the drums and in the shield is the trap: boron-10</text>
 <text x="40" y="408" font-size="13" fill="#333">eats a neutron and stops that chain. Lead does almost nothing to neutrons. That is</text>
 <text x="40" y="426" font-size="13" fill="#333">why the vault has a hydrogen-and-boron layer, then lead outside it.</text>

 <text x="40" y="460" font-size="13" font-weight="700" fill="#1a1a1a">Why graphite, not water</text>
 <text x="40" y="482" font-size="13" fill="#333">A neutron hitting carbon keeps most of its speed, so it takes many hits to slow</text>
 <text x="40" y="500" font-size="13" fill="#333">down. Hydrogen would slow it in fewer hits, which is why the shield uses plastic</text>
 <text x="40" y="518" font-size="13" fill="#333">with hydrogen, not the core. The core needs a solid that can sit hot for a century</text>
 <text x="40" y="536" font-size="13" fill="#333">without boiling. Graphite is that solid. A fast reactor skips this slowing step.</text>
</svg>
