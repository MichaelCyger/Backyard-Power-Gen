<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif">
 <rect width="1100" height="600" fill="#f7f6f2"/>
 <text x="24" y="28" font-size="16" font-weight="700" fill="#1a1a1a">Figure 24. Inverse square and TVLs do not replace MCNP</text>
 <text x="24" y="48" font-size="11" fill="#444">Unshielded 2 m flux is unsurvivable. Four neutron TVLs are about 10,000. Live-on-grass needs more, plus no streaming hole. Dirt is bonus.</text>

 <rect x="40" y="76" width="320" height="300" rx="8" fill="#fff" stroke="#bbb"/>
 <text x="200" y="106" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">1. Inverse square</text>
 <text x="56" y="140" font-size="13" fill="#333">Point source, empty space.</text>
 <text x="56" y="164" font-size="13" fill="#333">Flux falls as 1 / r squared.</text>
 <text x="56" y="200" font-size="13" fill="#1a1a1a">S = 2.62e15 n/s</text>
 <text x="56" y="224" font-size="13" fill="#1a1a1a">at 2 m: 5.2e9 n/cm2.s</text>
 <text x="56" y="260" font-size="13" fill="#8a2020">Immediately unsurvivable.</text>
 <text x="56" y="284" font-size="13" fill="#333">Why a beer-keg source is</text>
 <text x="56" y="304" font-size="13" fill="#333">easier than a plant core.</text>
 <text x="56" y="336" font-size="12" fill="#555">Not why the grass is 5 mrem/y.</text>
 <text x="56" y="356" font-size="12" fill="#555">Skyshine is not 1/r squared.</text>

 <rect x="390" y="76" width="320" height="300" rx="8" fill="#fff" stroke="#bbb"/>
 <text x="550" y="106" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">2. Tenth-value layers</text>
 <text x="406" y="140" font-size="13" fill="#333">25 cm BPE ~ 1.8 TVL</text>
 <text x="406" y="164" font-size="13" fill="#333">15 cm borated conc. ~ 0.6</text>
 <text x="406" y="188" font-size="13" fill="#333">40 cm concrete ~ 1.6</text>
 <text x="406" y="224" font-size="13" fill="#1a1a1a">~ 4 TVL neutrons ~ 10,000</text>
 <text x="406" y="248" font-size="13" fill="#1a1a1a">Lead + concrete ~ x4,000 gamma</text>
 <text x="406" y="284" font-size="13" fill="#8a2020">Not enough alone for 1e8 to 1e9.</text>
 <text x="406" y="308" font-size="13" fill="#333">If MCNP misses, add BPE or lead.</text>
 <text x="406" y="336" font-size="12" fill="#555">Do not add more dirt as the fix.</text>
 <text x="406" y="356" font-size="12" fill="#555">Dose is designed lid-bare.</text>

 <rect x="740" y="76" width="320" height="300" rx="8" fill="#fff" stroke="#8a2020" stroke-width="2"/>
 <text x="900" y="106" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">3. MCNP (still Open)</text>
 <text x="756" y="140" font-size="13" fill="#333">Real geometry: stack, chase,</text>
 <text x="756" y="160" font-size="13" fill="#333">labyrinth, skyshine, lid bare.</text>
 <text x="756" y="196" font-size="13" fill="#333">Running and shutdown.</text>
 <text x="756" y="216" font-size="13" fill="#333">Dry sand 5 wt% water, wet 15%.</text>
 <text x="756" y="252" font-size="13" fill="#1a1a1a">Pass: &lt;= 0.57 urem/h grass</text>
 <text x="756" y="276" font-size="13" fill="#1a1a1a">= 5 mrem/y live-on-grass</text>
 <text x="756" y="300" font-size="13" fill="#1a1a1a">Chase: &lt;= 50 urem/h</text>
 <text x="756" y="336" font-size="12" fill="#8a2020">Until that run exists, 5 mrem/y</text>
 <text x="756" y="356" font-size="12" fill="#8a2020">is a requirement, not a result.</text>

 <text x="40" y="420" font-size="13" font-weight="700" fill="#1a1a1a">House sentence</text>
 <text x="40" y="444" font-size="13" fill="#333">The vault is the shield. Ten feet of soil is the yard you see. A playset hour a day is then about 0.21 mrem/y, if the 5 mrem/y target holds.</text>
 <text x="40" y="476" font-size="13" font-weight="700" fill="#1a1a1a">Physics sentence</text>
 <text x="40" y="500" font-size="13" fill="#333">Most of the drop is absorption and scatter, not distance. Capture gammas are why lead sits outside the hydrogenous layer. Streaming holes</text>
 <text x="40" y="520" font-size="13" fill="#333">are why penetrations go through the floor with two 90-degree bends. 10 CFR 20.1301 is 100 mrem/y to the public; this design asks 5 mrem/y extra.</text>
</svg>
